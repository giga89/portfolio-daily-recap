name: eToro Delayed Follow-up Engagement

on:
  # ── Primary trigger: Orange Pi 5 local scheduler (+60min post-publish) ─────
  repository_dispatch:
    types: [delayed_engagement, followup_engagement, eu_open_followup, stock_focus_followup, us_open_followup, us_close_followup]
  # ── Fallback: GitHub Actions cron (1h after main sessions) ──────────────────
  schedule:
    - cron: '0 9 * * 1-5'    # EU open follow-up:    09:00 UTC (11:00 ITA)
    - cron: '15 13 * * 1-5'  # Stock focus follow-up: 13:15 UTC (15:15 ITA)
    - cron: '30 15 * * 1-5'  # US open follow-up:    15:30 UTC (17:30 ITA)
    - cron: '0 22 * * 1-5'   # US close follow-up:   22:00 UTC (00:00 ITA)
  workflow_dispatch:
    inputs:
      post_id:
        description: 'Target eToro Post ID (optional, defaults to last post in Gist)'
        required: false
        type: string
      force:
        description: 'Force run even if already processed or under 30min old'
        required: false
        type: boolean
        default: false

jobs:
  delayed-engagement:
    runs-on: ubuntu-latest
    environment: Etoro
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Delayed Engagement & Feed Revival
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          POST_ID: ${{ inputs.post_id }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          FLAGS=""
          if [ "$FORCE_RUN" = "true" ]; then
            FLAGS="--force"
          fi
          python src/delayed_engagement.py ${POST_ID} ${FLAGS}

      - name: Update GitHub Pages Dashboard & Analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to analytics database."
          else
            git commit -m "chore(analytics): update social analytics dashboard after delayed engagement [skip ci]"
            git push origin main || echo "Git push failed or branch protected"
          fi
