name: CI Test Suite & Code Audit Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_live_dry_runs:
        description: 'Run live dry-run checks with production Etoro environment secrets'
        required: false
        type: boolean
        default: true

jobs:
  unit-and-integration-tests:
    runs-on: ubuntu-latest
    environment: Etoro
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile all Python files
        run: |
          python3 -m compileall -q src/ scripts/ tests/

      - name: Validate JSON configuration files
        run: |
          python3 -c "import json; json.load(open('portfolio_config.json')); print('portfolio_config.json OK')"

      - name: Run full unit test suite
        run: |
          python3 -m unittest discover -s tests -v

      - name: Run live dry-run verification (Polls, Educational Series, Dividends, Event Monitor)
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_dry_runs == true
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_SECONDARY: ${{ secrets.TAVILY_API_KEY_SECONDARY }}
        run: |
          python3 src/poll_generator.py wednesday_thematic --dry-run
          python3 src/poll_generator.py friday_performers --dry-run
          python3 src/educational_series_publisher.py --publish --episode 1 --dry-run
          python3 src/dividend_tracker.py --auto --dry-run

