name: Stock News & Catalyst Follow-up Commenter

on:
  # ── Primary trigger: Orange Pi 5 local scheduler ────────────────────────────
  repository_dispatch:
    types: [stock_news, stock_news_monitor, catalyst_monitor]
  # ── Fallback: GitHub Actions cron (Mon-Fri 15:30 UTC = 17:30 ITA) ───────────
  schedule:
    - cron: '30 15 * * 1-5'
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Specific Ticker to check (e.g. NVDA, optional)'
        required: false
        type: string
      dry_run:
        description: 'Dry Run (preview comments without posting to eToro)'
        required: false
        type: boolean
        default: false

jobs:
  stock-news-commenter:
    runs-on: ubuntu-latest
    environment: Etoro
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock News & Catalyst Commenter
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKER_INPUT: ${{ inputs.ticker }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$TICKER_INPUT" ]; then
            ARGS="$ARGS --ticker $TICKER_INPUT"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python src/stock_news_commenter.py $ARGS

      - name: Update GitHub Pages Dashboard & Analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to analytics database."
          else
            git commit -m "chore(analytics): update social analytics dashboard after stock news commenting [skip ci]"
            git push origin main || echo "Git push failed or branch protected"
          fi
