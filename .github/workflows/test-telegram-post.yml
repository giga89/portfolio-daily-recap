name: Test Real Post (Telegram Only)

on:
  workflow_dispatch:
    inputs:
      session_name:
        description: 'Market session to simulate (e.g. US_CLOSE, EU_OPEN)'
        required: false
        default: 'US_CLOSE'

jobs:
  test-telegram:
    name: Generate & Verify Real Post (Telegram Only)
    runs-on: ubuntu-latest
    environment: Etoro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate, Consensus Audit & Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_and_send_test_telegram_post.py "${{ inputs.session_name || 'US_CLOSE' }}"
