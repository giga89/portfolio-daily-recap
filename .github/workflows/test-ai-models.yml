name: AI Model Cascade Test Suite

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode (both, probe_only, deep_probe, cascade_only)'
        required: false
        default: 'both'
        type: choice
        options:
          - both
          - probe_only
          - deep_probe
          - cascade_only

jobs:
  test-ai-models:
    name: Test All AI Models
    runs-on: ubuntu-latest
    environment: Etoro

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deep Probe (ThinkingConfig, Latency, Google Search Quota, Quality)
        if: ${{ inputs.mode == 'deep_probe' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_SECONDARY: ${{ secrets.TAVILY_API_KEY_SECONDARY }}
        run: |
          pip install --upgrade "google-auth>=2.56.0,<3.0.0" "google-genai>=3.0.0"
          python scripts/probe_live_apis.py --deep

      - name: Probe Live API Catalogs, Quotas & Capabilities
        if: ${{ inputs.mode == 'probe_only' || inputs.mode == 'both' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_SECONDARY: ${{ secrets.TAVILY_API_KEY_SECONDARY }}
        run: |
          python scripts/probe_live_apis.py

      - name: Run Comprehensive AI Model Test Suite
        if: ${{ inputs.mode == 'cascade_only' || inputs.mode == 'both' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TAVILY_API_KEY_SECONDARY: ${{ secrets.TAVILY_API_KEY_SECONDARY }}
        run: |
          python scripts/test_all_ai_models.py
