name: AI Community Comment Responder

on:
  # ── Automatic Scheduled Cron: Every 3 hours (09:00, 12:00, 15:00, 18:00, 21:00, 00:00 CET) ──
  schedule:
    - cron: '0 7,10,13,16,19,22 * * *'
  # ── Repository Dispatch (from local Orange Pi scheduler / API webhooks) ──
  repository_dispatch:
    types: [comment_responder, reply_comments]
  # ── Manual Trigger from GitHub UI ──
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        type: choice
        options:
          - 'live (Publish replies automatically to eToro)'
          - 'dry_run (Preview proposed replies only)'
        default: 'live (Publish replies automatically to eToro)'
      max_replies:
        description: 'Maximum comments to reply to'
        required: false
        default: '10'

jobs:
  respond-comments:
    runs-on: ubuntu-latest
    environment: Etoro
    permissions:
      contents: write
      pages: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Comment Responder
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME || 'AndreaRavalli' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          FLAG=""
          if [[ "${{ inputs.mode }}" == "dry_run"* ]]; then
            FLAG="--dry-run"
          fi
          python src/ai_comment_responder.py ${FLAG}

      - name: Sync eToro Likes & Post Analytics
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME || 'AndreaRavalli' }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import analytics_tracker; analytics_tracker.sync_etoro_metrics()"

      - name: Commit Updated Post Analytics & Likes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to post metrics."
          else
            git commit -m "chore(analytics): sync live eToro likes and engagement metrics [skip ci]"
            git push origin main || echo "Git push skipped"
          fi
