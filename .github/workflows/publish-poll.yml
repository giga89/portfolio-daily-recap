name: Publish eToro Community Poll

on:
  workflow_dispatch:
    inputs:
      poll_template:
        description: 'Poll Template to publish'
        required: true
        type: choice
        options:
          - megatrend_h2
          - ai_valuation_debate
          - risk_management_choice
          - pltr_conviction
        default: megatrend_h2

jobs:
  publish-poll:
    runs-on: ubuntu-latest
    environment: Etoro
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish Poll to eToro
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          POLL_TEMPLATE: ${{ inputs.poll_template }}
        run: |
          python src/poll_generator.py ${POLL_TEMPLATE}

      - name: Update GitHub Pages Dashboard & Analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to analytics database."
          else
            git commit -m "chore(analytics): update social analytics dashboard after poll publication [skip ci]"
            git push origin main || echo "Git push failed or branch protected"
          fi
