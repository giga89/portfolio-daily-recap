name: Daily Portfolio Recap

on:
  # ── Primary trigger: Orange Pi 5 local scheduler (precise timing) ──────────
  repository_dispatch:
    types: [eu_open, us_open, us_close, weekly_sat, weekly_sun]
  # ── Fallback: GitHub Actions cron (1 per session, Orange Pi is primary) ─────
  schedule:
    - cron: '45 7 * * 1-5'    # EU open fallback:  07:45 UTC
    - cron: '15 14 * * 1-5'   # US open fallback:  14:15 UTC
    - cron: '45 20 * * 1-5'   # US close fallback: 20:45 UTC
    - cron: '0 9 * * 6'       # Weekly recap (Saturday)  09:00 UTC
    - cron: '0 21 * * 0'      # Weekly recap (Sunday)    21:00 UTC
  workflow_dispatch:  # Allows manual trigger
    inputs:
      force_session:
        description: 'Force Session Name (e.g. "Weekly recap (Sat)")'
        required: false
        type: string
      force_run:
        description: 'Skip dedup check and force run even if session ran today'
        required: false
        type: boolean
        default: false

jobs:
  generate-recap:
    runs-on: ubuntu-latest
    environment: Etoro
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      

      - name: Determine market session
        id: market_session
        run: |
          # Priority: 1) forced session, 2) repository_dispatch, 3) cron schedule, 4) time-based fallback
          SCHEDULE="${{ github.event.schedule }}"
          FORCED_SESSION="${{ inputs.force_session }}"
          EVENT_TYPE="${{ github.event.action }}"
          DISPATCH_SESSION="${{ github.event.client_payload.session }}"
          TRIGGER="${{ github.event_name }}"
          SESSION_NAME="Daily recap"

          if [ -n "$FORCED_SESSION" ]; then
            # Map short keys to full session names (same mapping used for repository_dispatch)
            case "$FORCED_SESSION" in
              eu_open)    SESSION_NAME="European market open" ;;
              us_open)    SESSION_NAME="U.S. market open" ;;
              us_close)   SESSION_NAME="U.S. market close" ;;
              weekly_sat) SESSION_NAME="Weekly recap (Sat)" ;;
              weekly_sun) SESSION_NAME="Weekly recap (Sun)" ;;
              monthly)    SESSION_NAME="Monthly recap" ;;
              *)          SESSION_NAME="$FORCED_SESSION" ;;
            esac
            echo "Session forced to: $SESSION_NAME"
          elif [ "$TRIGGER" = "repository_dispatch" ]; then
            # Triggered by Orange Pi 5 local scheduler — session name is in the payload
            if [ -n "$DISPATCH_SESSION" ]; then
              SESSION_NAME="$DISPATCH_SESSION"
            else
              # Fallback: map event_type to session name
              case "$EVENT_TYPE" in
                eu_open)    SESSION_NAME="European market open" ;;
                us_open)    SESSION_NAME="U.S. market open" ;;
                us_close)   SESSION_NAME="U.S. market close" ;;
                weekly_sat) SESSION_NAME="Weekly recap (Sat)" ;;
                weekly_sun) SESSION_NAME="Weekly recap (Sun)" ;;
              esac
            fi
            echo "Triggered by Orange Pi 5 (repository_dispatch: $EVENT_TYPE)"
          elif [ -n "$SCHEDULE" ]; then
            # Map each cron expression to its session name (1 cron per session)
            case "$SCHEDULE" in
              "45 7 * * 1-5")
                SESSION_NAME="European market open" ;;
              "15 14 * * 1-5")
                SESSION_NAME="U.S. market open" ;;
              "45 20 * * 1-5")
                SESSION_NAME="U.S. market close" ;;
              "0 9 * * 6")
                SESSION_NAME="Weekly recap (Sat)" ;;
              "0 21 * * 0")
                SESSION_NAME="Weekly recap (Sun)" ;;
            esac
            echo "Triggered by GitHub cron (fallback): $SCHEDULE"
          else
            # Fallback for workflow_dispatch: detect from current UTC time
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            DAY=$(date -u +%u)
            HOUR=${HOUR#0}
            MINUTE=${MINUTE#0}
            MINUTE=${MINUTE:-0}
            if [ "$HOUR" -eq 20 ]; then
              TOMORROW=$(date -u -d "+1 day" +%d)
              if [ "$TOMORROW" == "01" ] && [ "$MINUTE" -lt 30 ]; then
                SESSION_NAME="Monthly recap"
              elif [ "$DAY" -ge 1 ] && [ "$DAY" -le 5 ]; then
                SESSION_NAME="U.S. market close"
              fi
            elif [ "$DAY" -eq 6 ] && [ "$HOUR" -eq 9 ]; then
              SESSION_NAME="Weekly recap (Sat)"
            elif [ "$DAY" -eq 7 ] && [ "$HOUR" -eq 21 ]; then
              SESSION_NAME="Weekly recap (Sun)"
            elif [ "$HOUR" -eq 6 ] || [ "$HOUR" -eq 7 ] || [ "$HOUR" -eq 8 ] || [ "$HOUR" -eq 9 ]; then
              SESSION_NAME="European market open"
            elif [ "$HOUR" -eq 13 ] || [ "$HOUR" -eq 14 ] || [ "$HOUR" -eq 15 ]; then
              SESSION_NAME="U.S. market open"
            elif [ "$HOUR" -eq 19 ] || [ "$HOUR" -eq 21 ] || [ "$HOUR" -eq 22 ]; then
              SESSION_NAME="U.S. market close"
            fi
          fi

          HOUR=$(date -u +%H); HOUR=${HOUR#0}
          echo "session=$SESSION_NAME" >> "$GITHUB_OUTPUT"
          echo "trigger=$TRIGGER" >> "$GITHUB_OUTPUT"
          echo "Market Session detected: $SESSION_NAME (trigger: ${TRIGGER}, cron: '${SCHEDULE:-n/a}', actual UTC Hour: $HOUR)"

      - name: Wait until target time
        run: |
          TRIGGER="${{ steps.market_session.outputs.trigger }}"
          SESSION="${{ steps.market_session.outputs.session }}"
          FORCE_RUN="${{ inputs.force_run }}"

          # Skip sleep for repository_dispatch — Orange Pi already triggered at the right time
          if [ "$TRIGGER" = "repository_dispatch" ]; then
            echo "Triggered by Orange Pi 5 — skipping sleep, proceeding immediately."
            exit 0
          fi

          # Skip sleep for forced manual runs (testing)
          if [ "$FORCE_RUN" = "true" ]; then
            echo "Force run — skipping wait, proceeding immediately."
            exit 0
          fi

          NOW=$(date -u +%s)
          TODAY=$(date -u +%Y-%m-%d)
          TARGET_EPOCH=0

          # Single cron per session → sleep ~20min to the target time.
          # These are winter-biased times; in summer the Orange Pi handles it.
          if [ "$SESSION" = "European market open" ]; then
            TARGET_EPOCH=$(date -u -d "$TODAY 08:05:00" +%s)
          elif [ "$SESSION" = "U.S. market open" ]; then
            TARGET_EPOCH=$(date -u -d "$TODAY 14:35:00" +%s)
          elif [ "$SESSION" = "U.S. market close" ]; then
            TARGET_EPOCH=$(date -u -d "$TODAY 21:05:00" +%s)
          fi

          if [ "$TARGET_EPOCH" -gt "$NOW" ]; then
            SLEEP_SECS=$((TARGET_EPOCH - NOW))
            echo "Sleeping ${SLEEP_SECS}s until $(date -u -d "@$TARGET_EPOCH") ..."
            sleep "$SLEEP_SECS"
          else
            echo "Non-market session or already past target time, proceeding immediately."
          fi

      - name: Check for duplicate session run
        id: dedup_check
        env:
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          MARKET_SESSION: ${{ steps.market_session.outputs.session }}
          FORCE_RUN: ${{ inputs.force_run }}
        run: |
          python - <<'PYEOF'
          import os, sys
          sys.path.insert(0, 'src')
          import gist_storage

          session = os.environ.get('MARKET_SESSION', '')
          force_run = os.environ.get('FORCE_RUN', 'false').lower() == 'true'
          market_sessions = {'European market open', 'U.S. market open', 'U.S. market close'}

          if force_run:
              print(f"FORCE RUN: dedup check bypassed for '{session}'.")
              skip = 'false'
          elif session not in market_sessions:
              print(f"Session '{session}' does not need deduplication, proceeding.")
              skip = 'false'
          elif gist_storage.has_session_run_today(session):
              print(f"DUPLICATE: '{session}' already ran today. Skipping.")
              skip = 'true'
          else:
              print(f"NEW RUN: '{session}'")
              skip = 'false'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'skip={skip}\n')
          PYEOF
                
      - name: Debug Environment Variables
        env:
          MARKET_SESSION: ${{ steps.market_session.outputs.session }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=== DEBUG VARIABLES ==="
          echo "MARKET_SESSION: $MARKET_SESSION"
          echo "SPREADSHEET_ID: $SPREADSHEET_ID"
          echo "TELEGRAM_CHAT_ID: $TELEGRAM_CHAT_ID"
          echo "Checking GOOGLE_SHEETS_CREDENTIALS length: ${#SECRETS_GOOGLE_SHEETS_CREDENTIALS}"
          echo "GIST_ID configured: ${{ secrets.GIST_ID != '' }}"
          echo "======================="

      - name: Collect data and generate recap
        if: steps.dedup_check.outputs.skip != 'true'
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          ORO_USERNAME: ${{ secrets.ETORO_USERNAME }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          # ── Telegram ──────────────────────────────────────────────
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # ── Threads (Meta Graph API) ───────────────────────────────
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # ── Twitter / X (OAuth 1.0a) ───────────────────────────────
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_POST_MONTHLY: "false"  # Daily at US close (free tier: ~1500 tweets/month)
          # ── Bluesky (AT Protocol) ──────────────────────────────────
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASS: ${{ secrets.BLUESKY_APP_PASS }}
          # ── LinkedIn (weekly only) ─────────────────────────────────
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_COMPANY_ID: ${{ secrets.LINKEDIN_COMPANY_ID }}
          # ── Facebook Page (Meta Graph API) ────────────────────────
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          # ── Instagram Business (Meta Graph API + imgbb) ───────────
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          MARKET_SESSION: ${{ steps.market_session.outputs.session }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Gist storage configuration
          # Gist storage configuration
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python src/data_collector.py
      
      - name: Upload recap as artifact
        if: steps.dedup_check.outputs.skip != 'true'
        uses: actions/upload-artifact@v5.0.0
        with:
          name: daily-recap
          path: |
            output/recap.txt
            output/*.png
            output/gemini_api_usage.json
            output/gemini_api_usage_report.txt
            output/engagement_card.png
      
      - name: Display recap
        if: steps.dedup_check.outputs.skip != 'true'
        run: cat output/recap.txt
      
      - name: Display API Usage Report
        if: steps.dedup_check.outputs.skip != 'true'
        run: |
          echo "📊 Gemini API Usage Report:"
          cat output/gemini_api_usage_report.txt || echo "No API usage report generated"

      - name: Mark session as completed
        if: steps.dedup_check.outputs.skip != 'true' && github.event_name != 'workflow_dispatch'
        env:
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          MARKET_SESSION: ${{ steps.market_session.outputs.session }}
          TRIGGER: ${{ github.event_name }}
        run: |
          python - <<'PYEOF'
          import os, sys
          sys.path.insert(0, 'src')
          import gist_storage

          session = os.environ.get('MARKET_SESSION', '')
          trigger = os.environ.get('TRIGGER', '')
          market_sessions = {'European market open', 'U.S. market open', 'U.S. market close'}

          if session in market_sessions:
              gist_storage.mark_session_run(session)
              print(f"Marked '{session}' as completed for today (trigger: {trigger}).")
          else:
              print(f"Session '{session}' does not need dedup marking.")
          PYEOF
