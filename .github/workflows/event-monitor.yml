name: Event Monitor (Earnings & Dividend Pay Days)

on:
  # ── Automatic Daily Cron: Mon-Fri at 08:00 UTC (10:00 CET/CEST) ──
  schedule:
    - cron: '0 8 * * 1-5'
  repository_dispatch:
    types: [event_monitor, check_events, check_dividends, check_earnings, pay_day]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: false
        type: choice
        options:
          - 'check_both'
          - 'check_dividends'
          - 'check_earnings'
          - 'trigger_dividend'
          - 'trigger_earnings'
        default: 'check_both'
      ticker:
        description: 'Ticker (required only if action is trigger_dividend or trigger_earnings)'
        required: false
        type: string
        default: ''
      lookback_days:
        description: 'Lookback days window for undetected events'
        required: false
        type: string
        default: '4'
      dry_run:
        description: 'Dry Run (preview post without publishing to eToro)'
        required: false
        type: boolean
        default: false

jobs:
  event-monitor:
    runs-on: ubuntu-latest
    environment: Etoro
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Event Monitor
        env:
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USERNAME: ${{ secrets.ETORO_USERNAME }}
          GIST_ACCESS_TOKEN: ${{ secrets.GIST_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASS: ${{ secrets.BLUESKY_APP_PASS }}
          ACTION_INPUT: ${{ inputs.action || 'check_both' }}
          TICKER_INPUT: ${{ inputs.ticker || '' }}
          LOOKBACK_INPUT: ${{ inputs.lookback_days || '4' }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$LOOKBACK_INPUT" ]; then
            ARGS="$ARGS --lookback $LOOKBACK_INPUT"
          fi

          case "$ACTION_INPUT" in
            check_dividends)
              python src/event_monitor.py --check-dividends $ARGS
              ;;
            check_earnings)
              python src/event_monitor.py --check-earnings $ARGS
              ;;
            trigger_dividend)
              TICK="${TICKER_INPUT:-GLEN.L}"
              python src/event_monitor.py --trigger-dividend "$TICK" $ARGS
              ;;
            trigger_earnings)
              TICK="${TICKER_INPUT:-AVGO}"
              python src/event_monitor.py --trigger-earnings "$TICK" $ARGS
              ;;
            *)
              python src/event_monitor.py $ARGS
              ;;
          esac

      - name: Update GitHub Pages Dashboard & Analytics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ data/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to analytics database."
          else
            git commit -m "chore(analytics): update social analytics dashboard after event publication [skip ci]"
            git push origin main || echo "Git push failed or branch protected"
          fi

